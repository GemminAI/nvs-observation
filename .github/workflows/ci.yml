# Public CI for nvs-observation. Self-contained: no private repository, no secrets, and
# nothing from outside this repository is needed. (Defined only; not run yet -- the public
# repository does not exist.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov pyyaml ruff mypy build

      - name: Lint
        run: ruff check src tests

      - name: Typecheck (strict)
        run: mypy src

      - name: Tests (no private dependency needed)
        run: pytest -p no:cacheprovider --cov=nvs_observation --cov-report=term

      - name: Registry matches the sources (test_registry (b))
        run: pytest -p no:cacheprovider --no-cov tests/test_registry.py

      - name: public-sync tools tests
        run: pytest -p no:cacheprovider --no-cov public-sync/tests

      - name: Allowlist and manifest check
        run: python public-sync/check_allowlist.py --package-root .

      - name: Build wheel and sdist
        run: python -m build --outdir dist

      - name: Audit the built artifacts
        run: python public-sync/audit_artifacts.py --rules public-sync/audit-rules.toml dist/*.whl dist/*.tar.gz
